name: Déploiement GitHub Pages

# Se déclenche à chaque push sur main, et manuellement depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si deux déploiements se lancent coup sur coup, on garde le plus récent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Les deux sites statiques sont publies a cote du portfolio, pour qu'on
      # puisse les consulter en ligne et pas seulement lire leur code.
      - name: Publier MexiGo et Yuki
        run: |
          mkdir -p dist/mexigo dist/yuki
          cp -r "PROJET_1 - Site_Vitrine/." dist/mexigo/
          cp -r "Site_Yuki/." dist/yuki/
          # La page d'entree de MexiGo s'appelle Accueil.html : on la duplique
          # en index.html pour que /mexigo/ fonctionne sans nom de fichier.
          cp dist/mexigo/Accueil.html dist/mexigo/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
